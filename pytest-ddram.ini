[pytest]
# DDRAM: Focused project validation; the default pytest configuration is unchanged.
testpaths =
    tests/device_timings/test_ddram_p.py
    tests/device_timings/test_ddr4.py
    tests/controller_scheduling/GenericDDRController/test_controller_ddram_p.py
    tests/controller_scheduling/GenericDDRController/test_ddram_p_always_a.py
    tests/controller_scheduling/GenericDDRController/test_ddram_p_managed_refresh.py
    tests/controller_scheduling/GenericDDRController/test_frfcfs_view_aware.py
    tests/controller_scheduling/GenericDDRController/test_controller_genericddr.py
# The shared GenericDDR module also contains a GDDR6-specific test.
addopts = -m ddram_p
